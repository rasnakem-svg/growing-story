rs preserve his line. Wisdom is life's greatest treasure. Trials develop perseverance.","21":"Better peace than strife. Religion that matters helps the orphaned and widowed.","22":"Isaac is born. Ishmael is sent away but God cares for him.","23":"A soft answer turns away wrath. The wise restrain anger.","24":"God tests Abraham; he obeys. God provides the sacrifice. Faith without works is dead.","25":"A wise son brings joy. The tongue is small but powerful.","26":"Sarah dies. Abraham purchases burial place—the first land claim.","27":"Hard work brings profit. Be patient in suffering.","28":"Give thanks for the Lord's enduring love. Prayer is powerful.","29":"Abraham's servant finds Rebekah—kind and hospitable.","30":"Rebekah chooses to go immediately. Isaac loves her deeply.","31":"Jacob deceives his father for the blessing. John the Baptist is born.","32":"Jacob sells his birthright. Zechariah prophesies about John.","33":"Jacob gains the blessing. Joseph is a righteous man.","34":"Jacob dreams of a ladder. Jesus is born in Bethlehem.","35":"Jacob loves Rachel. Shepherds are told the Messiah is born.","36":"Leah bears sons; Rachel finally bears Joseph.","37":"Jacob prospers and leaves with his family.","38":"Laban pursues but is warned. Jesus is circumcised and presented.","39":"Jacob wrestles God and is renamed Israel. Wise men visit Jesus.","40":"Esau embraces Jacob. Joseph flees to Egypt.","41":"Dinah is defiled. Jesus astounds teachers with His knowledge.","42":"Jacob builds an altar at Bethel. John baptizes in the wilderness.","43":"Esau's descendants prosper in Seir.","44":"Edom's kings establish themselves.","45":"Joseph dreams and is sold into slavery. John calls for repentance.","46":"Judah and Tamar; Perez is born. John appears calling for repentance.","47":"Joseph prospers then is imprisoned. Jesus is baptized; heavens open.","48":"Joseph interprets dreams. The Spirit drives Jesus into wilderness.","49":"Joseph interprets Pharaoh's dreams. Jesus resists all temptations.","50":"Joseph becomes second-in-command of Egypt.","51":"Jacob sends his sons to Egypt. Joseph tests them harshly.","52":"Jacob's family returns with Benjamin. Jesus returns in the Spirit's power.","53":"Judah offers himself as a slave. John testifies Jesus is the Lamb of God.","54":"Joseph reveals himself and weeps. John's disciples follow Jesus.","55":"God assures Jacob He will go to Egypt. Jesus turns water into wine.","56":"Jacob blesses Pharaoh. Jesus cleanses the temple.","57":"Jacob blesses Joseph's sons with crossed hands.","58":"Jacob blesses his sons; Judah will have the scepter.","59":"Joseph's faithfulness continues. Nicodemus learns about being born again.","60":"The psalmist commits to integrity. Job loses everything but refuses to curse God. John testifies Jesus is the bridegroom."};

const BST_READINGS = {"1":"Genesis 1:1-2:4","2":"Proverbs 8:1-36","3":"Proverbs 20:1-30, 1 John 1:1-2:6","4":"Genesis 2:5-25, Proverbs 4:14-27, 1 John 2:7-29","5":"Genesis 3:1-24, 1 John 3:1-10","6":"Genesis 4:1-26, 1 John 3:11-24","7":"Genesis 5:1-32, 1 John 4:1-6","8":"Genesis 6:1-22, 1 Chronicles 1:1-4","9":"Genesis 7:1-8:22","10":"Genesis 9:1-10:1, 1 John 4:7-21","11":"Genesis 10:2-20, 1 Chronicles 1:5-7, 1 John 5:1-21","12":"Genesis 10:21-30, 1 Chronicles 1:8-23, John 1:1-18, Luke 1:1-4","13":"Genesis 10:31-11:26, Matthew 1:1-17","14":"Genesis 11:27-12:20, 1 Chronicles 1:24-27, Luke 3:23-38","15":"Genesis 13:1-14:16","16":"Genesis 14:17-15:21","17":"Genesis 16:1-17:27, Luke 1:5-25","18":"Genesis 18:1-33, Luke 1:26-38","19":"Genesis 19:1-29, Luke 1:39-56","20":"Genesis 19:30-20:18, Proverbs 4:1-13, James 1:1-18","21":"Proverbs 17:1-28, James 1:19-27","22":"Genesis 21:1-34","23":"Proverbs 15:1-33","24":"Genesis 22:1-24, James 2:1-26","25":"Proverbs 10:1-32, James 3:1-18","26":"Genesis 23:1-20, Psalm 138:1-8, James 4:1-17","27":"Proverbs 13:1-25, James 5:1-12","28":"Psalm 107:1-43, James 5:13-20","29":"Genesis 24:1-28","30":"Genesis 24:29-67","31":"Genesis 25:1-26, 1 Chronicles 1:28-34, Luke 1:57-66","32":"Genesis 25:27-26:35, Luke 1:67-80","33":"Genesis 27:1-40, Matthew 1:18-25","34":"Genesis 27:41-28:22, Luke 2:1-7","35":"Genesis 29:1-30, Luke 2:8-20","36":"Genesis 29:31-30:24","37":"Genesis 30:25-31:21","38":"Genesis 31:22-55, Luke 2:21-40","39":"Genesis 32:1-32, Matthew 2:1-12","40":"Genesis 33:1-20, Matthew 2:13-23","41":"Genesis 34:1-31, Luke 2:41-52","42":"Genesis 35:1-29, Mark 1:1-8","43":"Genesis 36:1-30, 1 Chronicles 1:35-37","44":"Genesis 36:31-43, 1 Chronicles 1:38-2:2","45":"Genesis 37:1-36, Luke 3:1-18","46":"Genesis 38:1-30, 1 Chronicles 2:3-8, Matthew 3:1-12","47":"Genesis 39:1-23, Matthew 3:13-17, Mark 1:9-11","48":"Genesis 40:1-23, Luke 3:21-22, Mark 1:12-13","49":"Genesis 41:1-24, Matthew 4:1-11, Psalm 91:1-16","50":"Genesis 41:25-57","51":"Genesis 42:1-38","52":"Genesis 43:1-34, Luke 4:1-15","53":"Genesis 44:1-34, John 1:19-34","54":"Genesis 45:1-28, John 1:35-51","55":"Genesis 46:1-34, John 2:1-12","56":"Genesis 47:1-31, John 2:13-25","57":"Genesis 48:1-22","58":"Genesis 49:1-28","59":"Genesis 49:29-50:26, John 3:1-22","60":"Psalm 101:1-8, Job 1:1-22, John 3:23-36"};

let state = JSON.parse(localStorage.getItem('gs_state') || '{}');
if (!state.completed) state.completed = {};
if (!state.storyProgress) state.storyProgress = {};
if (!state.sermonCommentary) state.sermonCommentary = {};

function saveState() { localStorage.setItem('gs_state', JSON.stringify(state)); }

function handleSermonUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.verses && Array.isArray(data.verses)) {
        data.verses.forEach(item => { state.sermonCommentary[item.verse] = item.commentary; });
        saveState();
        renderToday();
        alert(`✓ Added ${data.verses.length} sermon commentaries!`);
      }
    } catch (err) { alert('Error reading file. Make sure it\'s a valid JSON export.'); }
  };
  reader.readAsText(file);
}

function getSermonCommentary(verseRef) {
  if (state.sermonCommentary[verseRef]) return state.sermonCommentary[verseRef];
  for (let key in state.sermonCommentary) {
    if (verseRef.includes(key) || key.includes(verseRef)) return state.sermonCommentary[key];
  }
  return null;
}

function getCurrentStoryIndex() {
  for (let i = 0; i < STORIES.length; i++) {
    if (!state.completed[i]) return i;
  }
  return STORIES.length - 1;
}

function drawSymbol(svgEl, type) {
  const rose = '#C9736A';
  const cx = 40, cy = 40;
  let html = '';
  if (type === 'sun') {
    html = `<circle cx="${cx}" cy="${cy}" r="16" fill="${rose}" opacity="0.9"/>${[0,45,90,135,180,225,270,315].map(a => {
      const rad = a * Math.PI/180;
      const x1 = cx + Math.cos(rad)*19, y1 = cy + Math.sin(rad)*19;
      const x2 = cx + Math.cos(rad)*28, y2 = cy + Math.sin(rad)*28;
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${rose}" stroke-width="2.5" stroke-linecap="round"/>`;
    }).join('')}`;
  } else {
    html = `<rect x="36" y="14" width="8" height="52" rx="2" fill="${rose}"/><rect x="16" y="30" width="48" height="8" rx="2" fill="${rose}"/>`;
  }
  svgEl.innerHTML = html;
}

function renderToday() {
  const si = getCurrentStoryIndex();
  const [title, desc, bstDays] = STORIES[si];
  const extras = EXTRAS[0] || {};

  document.getElementById('today-story-num').textContent = `Story ${si+1} of ${STORIES.length}`;
  document.getElementById('today-title').textContent = title;
  const today = new Date();
  const dateStr = today.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  document.getElementById('today-date').textContent = dateStr;

  const completed = Object.keys(state.completed).length;
  const pct = Math.round((completed / STORIES.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${completed} of ${STORIES.length} stories read`;

  drawSymbol(document.getElementById('symbol-svg'), extras.symbol || 'cross');
  document.getElementById('today-verse').textContent = extras.verse || '';

  const list = document.getElementById('readings-list');
  list.innerHTML = '';
  const showDays = bstDays.slice(0, Math.min(bstDays.length, 6));
  showDays.forEach(day => {
    const ref = BST_READINGS[day] || `BST Day ${day}`;
    const done = state.storyProgress[si]?.includes(day);
    const li = document.createElement('li');
    li.className = 'reading-item' + (done ? ' done' : '');
    
    const sermonCommentary = getSermonCommentary(ref);
    const summary = sermonCommentary || VERSE_SUMMARIES[day];
    const summaryHtml = summary ? `<div class="verse-summary"><div class="verse-summary-label">${sermonCommentary ? 'Your Sermon' : 'Summary'}</div>${summary}</div>` : '';
    
    li.innerHTML = `<div class="reading-check"></div><div style="flex:1"><div class="reading-ref"><span style="font-size:11px;color:var(--rose-mid);font-family:sans-serif">Day ${day}</span><br>${ref}</div>${summaryHtml}</div>`;
    li.onclick = () => toggleReading(si, day, li);
    list.appendChild(li);
  });
  
  if (bstDays.length > 6) {
    const more = document.createElement('li');
    more.className = 'reading-item';
    more.innerHTML = `<div class="reading-check"></div><div class="reading-ref" style="color:var(--ink-mid);font-style:italic">+ ${bstDays.length - 6} more readings in this story</div>`;
    list.appendChild(more);
  }

  document.getElementById('char-name').textContent = extras.character || '';
  document.getElementById('char-portrait').textContent = extras.portrait || '';
  document.getElementById('map-loc').textContent = extras.map || '';
  document.getElementById('map-note').textContent = extras.mapNote || '';
  document.getElementById('today-desc').textContent = desc;

  const btn = document.getElementById('complete-btn');
  if (state.completed[si]) {
    btn.textContent = '✓ Story Complete';
    btn.classList.add('done');
  } else {
    btn.textContent = 'Mark Story Complete ✓';
    btn.classList.remove('done');
  }

  updateTabs('today');
}

function toggleReading(si, day, el) {
  if (!state.storyProgress[si]) state.storyProgress[si] = [];
  const idx = state.storyProgress[si].indexOf(day);
  if (idx > -1) {
    state.storyProgress[si].splice(idx, 1);
    el.classList.remove('done');
  } else {
    state.storyProgress[si].push(day);
    el.classList.add('done');
  }
  saveState();
}

function markStoryComplete() {
  const si = getCurrentStoryIndex();
  if (state.completed[si]) {
    delete state.completed[si];
  } else {
    state.completed[si] = true;
    state.storyProgress[si] = STORIES[si][2].slice();
  }
  saveState();
  renderToday();
}

function renderSoFar() {
  const si = getCurrentStoryIndex();
  const sentences = [];
  for (let i = 0; i <= si; i++) {
    const desc = STORIES[i][1];
    const first = desc.split('.')[0].trim() + '.';
    sentences.push(first);
  }
  document.getElementById('sofar-text').textContent = sentences.join(' ');
  updateTabs('sofar');
}

function renderPlan() {
  const si = getCurrentStoryIndex();
  const container = document.getElementById('plan-list');
  container.innerHTML = '';
  STORIES.forEach(([title,,days], i) => {
    const done = state.completed[i];
    const current = i === si;
    const div = document.createElement('div');
    div.className = 'story-row' + (done ? ' completed' : '') + (current ? ' current' : '');
    div.innerHTML = `<div class="story-row-num">${i+1}</div><div class="story-row-content"><div class="story-row-title">${title}</div><div class="story-row-days">${days.length} days</div></div><div class="story-row-tick">${done ? '✓' : ''}</div>`;
    div.onclick = () => goToStory(i);
    container.appendChild(div);
  });
  updateTabs('plan');
}

function goToStory(index) {
  state.completed = {};
  for (let i = 0; i < index; i++) { state.completed[i] = true; }
  saveState();
  showToday();
}

function showToday() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-today').classList.add('active');
  renderToday();
}

function showSoFar() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-sofar').classList.add('active');
  renderSoFar();
}

function showPlan() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-plan').classList.add('active');
  renderPlan();
}

function updateTabs(active) {
  document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
  const screens = ['today', 'sofar', 'plan'];
  const idx = screens.indexOf(active);
  if (idx >= 0) document.querySelectorAll('.tab')[idx].classList.add('active');
}

showToday();
</script>
