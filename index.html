<title>The Growing Story</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --cream: #FBF6EE;
    --rose: #C9736A;
    --rose-mid: #D4948C;
    --rose-lt: #F5E8E6;
    --rose-dark: #8A4F48;
    --ink: #3A3A3A;
    --ink-mid: #6B6B6B;
    --line: #E2D5CC;
    --gold: #C4965A;
  }

  html, body {
    height: 100%;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Georgia', serif;
    overflow: hidden;
  }

  /* ── SCREENS ── */
  .screen { display: none; flex-direction: column; height: 100dvh; overflow: hidden; }
  .screen.active { display: flex; }

  /* ── NAV BAR ── */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px 8px;
    background: var(--cream);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .nav-title { font-size: 13px; color: var(--rose); letter-spacing: 0.08em; font-family: sans-serif; font-weight: 500; }
  .nav-btn { background: none; border: none; color: var(--rose); font-size: 20px; cursor: pointer; padding: 4px 8px; }

  /* ── SCROLLABLE CONTENT ── */
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 24px 24px 40px; }

  /* ── TODAY SCREEN ── */
  .story-number { font-family: sans-serif; font-size: 11px; letter-spacing: 0.12em; color: var(--rose-mid); text-transform: uppercase; margin-bottom: 6px; }

  .story-title {
    font-size: 28px; color: var(--rose); line-height: 1.25;
    margin-bottom: 4px;
    font-style: italic;
  }

  .date-line { font-family: sans-serif; font-size: 13px; color: var(--ink-mid); margin-bottom: 20px; }

  .card {
    background: white; border-radius: 16px;
    border: 1px solid var(--line);
    padding: 18px 20px; margin-bottom: 16px;
  }

  .card-label {
    font-family: sans-serif; font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--rose-mid);
    margin-bottom: 8px;
  }

  .card-body { font-size: 15px; line-height: 1.7; color: var(--ink); }
  .card-body.verse { font-style: italic; font-size: 16px; color: var(--rose-dark); line-height: 1.6; }

  .readings-list { list-style: none; }
  .reading-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .reading-item:last-child { border-bottom: none; }

  .reading-check {
    width: 22px; height: 22px; border-radius: 6px;
    border: 1.5px solid var(--rose-mid);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; margin-top: 1px;
    background: white;
  }
  .reading-item.done .reading-check {
    background: var(--rose); border-color: var(--rose);
  }
  .reading-item.done .reading-check::after { content: '✓'; color: white; font-size: 13px; font-family: sans-serif; }
  .reading-item.done .reading-ref { text-decoration: line-through; color: var(--ink-mid); }

  .reading-ref { font-size: 14px; line-height: 1.5; color: var(--ink); }

  .char-name { font-size: 15px; font-weight: bold; color: var(--rose-dark); margin-bottom: 6px; font-style: italic; }

  .map-loc { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .map-loc-name { font-family: sans-serif; font-size: 14px; font-weight: 500; color: var(--rose-dark); }
  .map-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rose); flex-shrink: 0; }
  .map-note { font-size: 13px; color: var(--ink-mid); line-height: 1.5; }

  /* Symbol illustration */
  .symbol-box {
    text-align: center; padding: 20px 0 8px;
  }
  .symbol-svg { width: 80px; height: 80px; }

  /* Progress bar */
  .progress-wrap { margin: 4px 0 20px; }
  .progress-bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--rose); border-radius: 2px; transition: width 0.5s; }
  .progress-label { font-family: sans-serif; font-size: 11px; color: var(--ink-mid); margin-top: 5px; text-align: right; }

  /* Complete button */
  .complete-btn {
    width: 100%; padding: 16px; border-radius: 14px;
    background: var(--rose); color: white; border: none;
    font-size: 16px; font-family: 'Georgia', serif; font-style: italic;
    cursor: pointer; margin-top: 8px;
    transition: background 0.2s, transform 0.1s;
  }
  .complete-btn:active { transform: scale(0.98); }
  .complete-btn.done { background: var(--rose-mid); }

  /* ── SO FAR SCREEN ── */
  .sofar-header { text-align: center; padding: 20px 0 16px; }
  .sofar-title { font-size: 32px; color: var(--rose); font-style: italic; }
  .sofar-subtitle { font-family: sans-serif; font-size: 12px; color: var(--rose-mid); letter-spacing: 0.1em; margin-top: 4px; }

  .sofar-divider { width: 60px; height: 1px; background: var(--rose-mid); margin: 16px auto; }

  .sofar-text { font-size: 15px; line-height: 1.85; color: var(--ink); }

  .cross-symbol { text-align: center; font-size: 36px; color: var(--rose); margin: 28px 0 8px; }

  /* ── PLAN SCREEN ── */
  .story-row {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .story-row:last-child { border-bottom: none; }
  .story-row-num {
    font-family: sans-serif; font-size: 11px; color: var(--rose-mid);
    min-width: 24px; padding-top: 2px; text-align: right;
  }
  .story-row-content { flex: 1; }
  .story-row-title { font-size: 15px; font-style: italic; color: var(--rose-dark); line-height: 1.3; }
  .story-row-days { font-family: sans-serif; font-size: 11px; color: var(--ink-mid); margin-top: 3px; }
  .story-row-tick {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid var(--line); flex-shrink: 0; margin-top: 1px;
    display: flex; align-items: center; justify-content: center; font-size: 11px;
  }
  .story-row.completed .story-row-tick { background: var(--rose); border-color: var(--rose); color: white; }
  .story-row.current { background: var(--rose-lt); margin: 0 -24px; padding: 14px 24px; }
  .story-row.current .story-row-title { color: var(--rose); }

  /* ── TAB BAR ── */
  .tab-bar {
    display: flex; background: var(--cream);
    border-top: 1px solid var(--line);
    flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; padding: 10px 0 8px;
    cursor: pointer; border: none; background: none;
    color: var(--ink-mid); font-family: sans-serif; font-size: 10px; gap: 3px;
    letter-spacing: 0.04em; text-transform: uppercase;
    transition: color 0.15s;
  }
  .tab.active { color: var(--rose); }
  .tab-icon { font-size: 20px; line-height: 1; }

  /* notification prompt */
  .notif-banner {
    background: var(--rose-lt); border: 1px solid var(--rose-mid);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .notif-icon { font-size: 22px; flex-shrink: 0; }
  .notif-text { font-family: sans-serif; font-size: 13px; color: var(--rose-dark); line-height: 1.5; }
  .notif-btn {
    margin-top: 8px; padding: 7px 14px; background: var(--rose);
    color: white; border: none; border-radius: 8px; font-size: 13px;
    cursor: pointer; font-family: sans-serif;
  }
</style>
</head>

<!-- ── TODAY SCREEN ── -->
<div class="screen active" id="screen-today">
  <div class="nav">
    <span class="nav-title">THE GROWING STORY</span>
    <button class="nav-btn" onclick="showSoFar()">†</button>
  </div>
  <div class="scroll" id="today-scroll">
    <div id="notif-prompt"></div>
    <div class="story-number" id="today-story-num"></div>
    <div class="story-title" id="today-title"></div>
    <div class="date-line" id="today-date"></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-label" id="progress-label"></div>
    </div>

    <!-- Symbol -->
    <div class="symbol-box"><svg class="symbol-svg" id="symbol-svg" viewBox="0 0 80 80"></svg></div>

    <!-- Key Verse -->
    <div class="card">
      <div class="card-label">Key Verse</div>
      <div class="card-body verse" id="today-verse"></div>
    </div>

    <!-- Readings -->
    <div class="card">
      <div class="card-label">Today's Readings</div>
      <ul class="readings-list" id="readings-list"></ul>
    </div>

    <!-- Character -->
    <div class="card">
      <div class="card-label">Character Spotlight</div>
      <div class="char-name" id="char-name"></div>
      <div class="card-body" id="char-portrait"></div>
    </div>

    <!-- Map -->
    <div class="card">
      <div class="card-label">Where It Happened</div>
      <div class="map-loc"><div class="map-dot"></div><div class="map-loc-name" id="map-loc"></div></div>
      <div class="map-note" id="map-note"></div>
    </div>

    <!-- Growing Story (cumulative narrative) -->
    <div class="card">
      <div class="card-label">The Growing Story</div>
      <div class="card-body" id="growing-story"></div>
    </div>

    <button class="complete-btn" id="complete-btn" onclick="markStoryComplete()">Mark Story Complete ✓</button>
  </div>
</div>

<!-- ── SO FAR SCREEN ── -->
<div class="screen" id="screen-sofar">
  <div class="nav">
    <button class="nav-btn" onclick="showToday()">←</button>
    <span class="nav-title">THE STORY SO FAR</span>
    <span style="width:40px"></span>
  </div>
  <div class="scroll">
    <div class="sofar-header">
      <div class="sofar-title">The Story So Far</div>
      <div class="sofar-subtitle">YOUR GROWING NARRATIVE</div>
    </div>
    <div class="sofar-divider"></div>
    <div class="sofar-text" id="sofar-text"></div>
    <div class="cross-symbol">†</div>
  </div>
</div>

<!-- ── PLAN SCREEN ── -->
<div class="screen" id="screen-plan">
  <div class="nav">
    <span class="nav-title">READING PLAN</span>
    <span style="width:40px"></span>
  </div>
  <div class="scroll">
    <div id="plan-list"></div>
  </div>
</div>

<!-- ── TAB BAR ── -->
<div class="tab-bar">
  <button class="tab active" id="tab-today" onclick="switchTab('today')">
    <span class="tab-icon">☀</span>Today
  </button>
  <button class="tab" id="tab-sofar" onclick="switchTab('sofar')">
    <span class="tab-icon">✦</span>So Far
  </button>
  <button class="tab" id="tab-plan" onclick="switchTab('plan')">
    <span class="tab-icon">☰</span>Plan
  </button>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────
const STORIES = [
  ["In the Beginning: God Creates","God speaks light, land, life, and humanity into existence. Wisdom was with Him as a master craftsman, delighting in His work. Man and woman are made in His image — the crown of all creation, made for relationship with their Maker.",[1,2,3,4]],
  ["The Fall: Sin Enters the World","A serpent whispers, Eve doubts, Adam follows — and the image cracks. Shame, blame, and death enter the story. But in the curse God plants the first promise: a Seed from the woman will crush the serpent.",[5,6,7]],
  ["Noah: Judgment and Grace","The earth fills with violence until God sees only one man walking with Him. He instructs Noah to build an ark. The floodwaters rise and fall, and God seals His first covenant with a rainbow in the clouds.",[8,9,10]],
  ["Babel: Pride and Scattering","The sons of Noah fill the earth. But pride gathers them at Babel, building a tower to make a name for themselves. God confuses their language and scatters them across the earth.",[11,12,13]],
  ["Abram: Called Out by Faith","God calls one man out of Ur with a promise of land, descendants, and worldwide blessing. Abram goes by faith, not by sight. Melchizedek appears as a mysterious priest-king pointing to Christ.",[14,15,16]],
  ["Abraham: The Covenant Sealed","God cuts a covenant with Abram in fire and deep darkness, passing between the pieces alone. He changes his name to Abraham. Hagar discovers El Roi — the God who sees — in her wilderness.",[17,18,19,20,21]],
  ["Isaac: The Son of Laughter","Against every natural possibility, Isaac is born. God then tests Abraham to the limit at Mount Moriah. He obeys — and God provides the ram. Jehovah Jireh: the Lord Who Provides.",[22,23,24,25]],
  ["A Bride for Isaac","Abraham sends his servant to find a bride for Isaac. Rebekah comes willingly. This journey is a portrait of Christ pursuing His Church across every obstacle.",[26,27,28,29,30]],
  ["Jacob and Esau: The Birthright","Two nations struggle in Rebekah's womb. Esau sells his birthright for stew. Jacob steals the blessing. God's sovereign election works through deeply flawed humanity.",[31,32,33,34]],
  ["Jacob's Ladder: A Dream at Bethel","Jacob flees and sleeps under the stars. He dreams of a ladder to heaven with angels ascending and descending — and hears the covenant renewed over him at his lowest moment.",[35]],
  ["Jacob and Laban: Twenty Years","Jacob works seven years for Rachel, wakes up married to Leah, works seven more. Twelve sons are born. He finally escapes — and wrestles God at the Jabbok River.",[36,37,38,39,40,41]],
  ["Jacob Wrestles with God","On the eve of meeting Esau, Jacob wrestles through the night with a mysterious stranger. He refuses to let go without a blessing. He walks away limping — renamed Israel.",[42,43,44]],
  ["Joseph: The Dreamer Betrayed","Joseph's brothers sell him to traders headed for Egypt. They dip his coat in blood and bring it to their father. The dreamer descends into slavery.",[45,46]],
  ["Joseph: Faithful in the Pit","In Potiphar's house Joseph rises — until a false accusation lands him in prison. He interprets dreams. The cupbearer forgets him for two full years.",[47,48,49,50]],
  ["Joseph: From Prison to Palace","Pharaoh dreams of seven fat cows swallowed by seven lean ones. Joseph interprets — and is made second-in-command of all Egypt in a single day.",[51,52]],
  ["Joseph: The Brothers Reunited","The brothers bow before Joseph not knowing who he is. He tests them, then reveals himself through tears: I am Joseph. What you meant for evil, God meant for good.",[53,54,55,56,57,58,59]],
  ["Job: A Righteous Man's World Collapses","Job loses children, wealth, and health in a single day. He does not curse God. His friends arrive, sit in silence for seven days, and then open their mouths.",[60,61,62,63]],
  ["Job and His Friends: Suffering Debated","Eliphaz, Bildad, and Zophar accuse Job: you must have sinned. Job insists on his innocence and demands to meet God. Tidy theology fails in the face of real suffering.",[64,65,66,67,68,69,70]],
  ["Job: Elihu Speaks","A young man who has been listening finally speaks up. He is angry at the friends for failing to answer, and at Job for justifying himself above God.",[71,72,73,74,75,76,77,78,79,80,81,82,83,84,85,86,87,88,89,90]],
  ["Job: God Speaks from the Whirlwind","God answers not with explanations but with questions. Job is humbled before divine vastness — then restored double what he lost.",[91,92,93,94,95,96]],
  ["Moses: Born for This Moment","A baby floats on the Nile, grows up in Pharaoh's palace, flees to the desert. At a burning bush that will not be consumed: I AM WHO I AM. Go.",[97,98,99,100]],
  ["The Plagues: Darkness Over Egypt","Moses stands before Pharaoh. Blood, frogs, gnats, flies — plague after plague dismantles Egypt's gods and proves that the God of Israel reigns over all creation.",[101,102,103,104,105,106,107]],
  ["Passover: The Night Everything Changed","A lamb's blood is painted on doorposts. Death passes over every marked house. Israel walks out of four centuries of bondage in a single night.",[108,109,110]],
  ["Crossing the Red Sea","Israel is trapped between Pharaoh's army and the sea. Moses lifts his staff. The water divides. They cross on dry ground. Miriam leads the women in song.",[111,112]],
  ["The Wilderness: Manna and Grumbling","Three days in and Israel is already complaining. God provides manna, quail, and water from a rock. The wilderness is where trust is forged — or broken.",[113,114]],
  ["Mount Sinai: The Law Given","The mountain shakes with fire and thunder. God speaks the Ten Commandments in a voice so terrifying the people beg Moses to be their intermediary.",[115,116,117,118,119]],
  ["The Tabernacle: God's Blueprint","God gives Moses forty days of detailed instructions for a portable sanctuary. Every board, curtain, and altar is intentional — theology made architecture.",[120,121,122,123,124,125,126,127]],
  ["The Golden Calf: Betrayal at Sinai","The people demand gods they can see. Aaron makes a golden calf. Moses intercedes with breathtaking boldness: blot me out instead. God relents.",[128,129,130]],
  ["The Tabernacle Built: Glory Fills the House","Every part built exactly as commanded. The cloud of God's glory fills it so completely that even Moses cannot enter. The Holy One has moved in.",[131,132,133,134,135,136,137,138,139,140]],
  ["Leviticus: The Priesthood Established","Aaron and his sons are consecrated. Nadab and Abihu offer unauthorized fire before the Lord and are struck dead. The line between holy and common is not negotiable.",[141,142,143,144,145,146,147,148,149,150]],
  ["Leviticus: Drawing Near Through Sacrifice","Burnt offerings, grain offerings, peace offerings, sin offerings — each a picture of the costly grace required to stand before a holy God.",[151,152,153,154,155,156,157,158,159,160]],
  ["The Day of Atonement: Once a Year","The High Priest enters the Most Holy Place with blood — not his own. The whole system cries out for something better, something once-for-all.",[161,162,163,164,165,166,167]],
  ["The Holiness Code: Be Holy As I Am Holy","Food, sexuality, farming, business, treatment of the poor — all of life brought under God's character. Holiness is about resemblance, not just ritual.",[168,169,170,171,172,173,174,175,176,177,178]],
  ["Numbers: The Camp Organized","God takes a census. Tribes are arranged around the Tabernacle. The Levites are set apart. Order is not the absence of spirituality — it is an expression of it.",[179,180,181,182,183,184,185,186,187,188,189,190,191,192,193,194,195,196]],
  ["Leaving Sinai: The Journey Begins","After a year at Sinai, the cloud lifts. The complaining begins almost immediately. Quail arrives, then a plague. The wilderness tests everything Israel believes.",[197,198,199,200]],
  ["The Spies: Faith Fails at the Border","Ten spies return terrified. Only Caleb and Joshua urge trust. God's verdict: forty years in the wilderness. That entire generation will not see the Promised Land.",[201,202,203,204,205]],
  ["Balaam: The Donkey Speaks","A prophet for hire opens his mouth to curse Israel — and blessing comes out every time. God speaks through a donkey. His purposes simply cannot be thwarted.",[206,207,208,209,210,211,212,213,214,215,216,217,218,219]],
  ["Deuteronomy: Remember","On the plains of Moab, Moses retells everything — every provision, every failure. Memory is the foundation of faithfulness for the next generation.",[220,221,222,223,224,225,226,227,228,229,230]],
  ["Deuteronomy: Love the Lord Your God","The great command: love the Lord with all your heart, soul, and strength. Teach it to your children. Write it on your doorposts. The law is a gift.",[231,232,233,234,235,236,237,238,239,240]],
  ["Deuteronomy: Choose Life","Moses lays out the blessings and the curses, the two paths stretching before Israel. I have set before you life and death. Choose life.",[241,242,243,244,245,246,247,248,249,250]],
  ["Moses' Final Blessing and Death","Moses blesses each tribe, climbs Mount Nebo, sees the land — and God Himself buries him in an unknown grave. Then Joshua takes command.",[251,252,253,254,255,256,257,258]],
  ["Rahab, the Jordan, and Jericho","Rahab hides the spies and ties a scarlet cord in her window. The Jordan parts. Jericho's walls fall at a shout. Faith — even fragile faith — is what God honors.",[259,260,261,262,263,264,265,266]],
  ["The Conquest of Canaan","Joshua leads swift campaigns. The sun stands still over Gibeon. City after city yields. The land is divided tribe by tribe. Joshua's final word: choose this day whom you will serve.",[267,268,269,270,271,272,273,274,275,276,277,278,279,280,281]],
  ["Judges: The Cycle of Sin","Without a king, Israel falls into a devastating cycle: sin, oppression, crying out, rescue — then sin again. Deborah leads, Gideon defeats thousands with three hundred. Samson rises and falls.",[282,283,284,285,286,287,288,289,290,291,292,293,294,295,296,297,298,299,300,301,302,303,304,305]],
  ["Ruth: Loyalty and Redemption","A Moabite widow says: where you go I will go. Boaz the kinsman-redeemer pays the full price to restore what was lost. Their son will be the grandfather of King David.",[306,307,308,309]],
  ["Samuel and Saul: Israel's First King","Hannah's prayer births the last great judge. Israel demands a king. God gives them Saul — tall, promising, and ultimately unable to obey.",[310,311,312,313,314,315,316,317,318,319,320,321,322]],
  ["David: The Shepherd King","God chooses the youngest shepherd boy. David faces Goliath with a sling and the Lord's name. He serves Saul faithfully through years of wilderness running, pouring out his soul in psalms.",[323,324,325,326,327,328,329,330,331,332,333,334,335,336,337,338,339,340,341,342,343,344,345]],
  ["David Becomes King: The Covenant Throne","David unites the kingdom, brings the Ark to Jerusalem with dancing, and receives the stunning promise: your throne will be established forever.",[346,347,348,349,350,351,352,353,354,355,356,357,358,359,360,361,362,363,364,365]],
  ["David and Bathsheba","At the height of his power, David commits adultery and murder. Nathan confronts him with a story about a stolen lamb. David's response — I have sinned — reveals his heart.",[366,367,368]],
  ["Absalom's Rebellion","David's sin fractures his family. His son Absalom seizes the throne. David flees Jerusalem weeping. The consequences of his own choices close in around him.",[369,370,371,372,373,374,375,376,377,378,379,380,381,382,383,384,385,386,387,388,389,390,391]],
  ["Solomon's Wisdom and the Temple","Solomon asks for wisdom. God gives him everything. He builds a breathtaking Temple — then lets foreign wives turn his heart away from the God who gave it all.",[392,393,394,395,396,397,398,399,400,401,402,403,404,405,406,407,408,409,410,411,412,413,414,415,416,417,418]],
  ["Ecclesiastes: Vanity Under the Sun","The Preacher tried everything — wisdom, pleasure, wealth, work — and found it empty apart from God. Fear God and keep His commandments. This is the whole duty of humanity.",[419,420,421,422,423,424,425,426,427]],
  ["The Kingdom Divides","Rehoboam's arrogance tears the nation in two. Ten tribes follow Jeroboam north. Jeroboam immediately sets up golden calves. The division will never fully heal.",[428,429,430,431,432,433,434,435,436,437]],
  ["Elijah: Fire from Heaven and Still Small Voice","Fire falls at Mount Carmel. Elijah outrans a chariot — then collapses under a broom tree asking to die. God meets him with food, rest, and a still small voice.",[438,439,440,441,442,443,444,445,446,447,448]],
  ["Elisha: A Double Portion","Elisha inherits Elijah's mantle and performs twice as many miracles — healing Naaman, raising the dead, making an axe head float on water.",[449,450,451,452,453,454,455,456,457,458,459,460,461,462,463,464,465,466,467,468]],
  ["Jonah, Amos, and Hosea","Jonah runs from God and ends up preaching the greatest revival in history. Amos thunders for justice. Hosea buys back his unfaithful wife — as God loves unfaithful Israel.",[469,470,471,472,473,474,475,486,487,488,489,490,491,492,493]],
  ["Isaiah: Holy, Holy, Holy","Isaiah sees the Lord high and lifted up. A seraph touches his lips with a coal. He is sent to a people who will not listen — and writes the most Christ-saturated prophecy in all of Scripture.",[476,477,478,479,480,481,482,483,484,485,494,495,496]],
  ["Hezekiah and Isaiah: The Servant Who Suffers","Sennacherib surrounds Jerusalem. Hezekiah spreads his letter before God. That night 185,000 Assyrians die. Isaiah sees further: a Servant wounded for our transgressions, crushed for our iniquities.",[497,498,499,500,501,502,503,504,505,506,507,508,509,510,511,512,513,514,515,516,517,518,519,520,521,522,523,524,525,526,527,528,529,530]],
  ["Jeremiah: The Weeping Prophet","Jeremiah preaches for forty years without a single visible convert. He is beaten, imprisoned, thrown in a cistern. God never stops sending him. His steadfast love never ceases.",[531,532,533,534,535,536,537,538,539,540,541,542,543,544,545,546,547,548,549,550,551,552,553,554,555,556,557,558,559,560]],
  ["The Fall of Jerusalem and the Exile","The Babylonians break through. The Temple burns. Lamentations is the sound of sitting in the rubble. But in the exact center of the grief: His mercies are new every morning.",[561,562,563,564,565,566,567,568,569,570,571,572,573,574,575,576,577,578,579,580,581,582,583,584,585,586,587,588,589,590,591,592,593,594,595,596,597,598,599,600,601,602,603,604,605,606,607,608,609,610,611,612,613,614,615,616,617,618,619,620,621,622,623,624,625,626,627,628,629,630,631,632,633,634,635,636,637,638,639,640,641]],
  ["The Return: Ezra, Nehemiah, and Esther","Cyrus decrees the exiles may return. Ezra leads them back. Nehemiah rebuilds the walls in 52 days. Esther risks her life: for such a time as this.",[642,643,644,645,646,647,648,649,650,651,652,653,654,655,656,657,658,659,660,661,662,663,664,665,666,667,668,669,670,671,672,673,674,675,676,677,678,679,680,681,682,683,684,685,686,687,688,689,690,691,692,693,694,695,696,697,698,699,700,701,702,703,704,705,706,707,708,709,710,711,712,713,714,715]],
  ["Malachi and the Long Silence","Malachi is the last voice before 400 years of silence. He closes with a promise: the sun of righteousness will rise with healing in its wings. Then — waiting.",[716,717,718,719,720,721,722,723,724,725,726,727,728,729,730]]

// ── STATE ──────────────────────────────────────────────────────────
const START_DATE = new Date('2026-04-30');
let state = JSON.parse(localStorage.getItem('gs_state') || '{}');
if (!state.completed) state.completed = {};
if (!state.storyProgress) state.storyProgress = {};

function saveState() { localStorage.setItem('gs_state', JSON.stringify(state)); }

// ── CURRENT STORY ─────────────────────────────────────────────────
function getCurrentStoryIndex() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const start = new Date(START_DATE);
  start.setHours(0,0,0,0);
  const daysSinceStart = Math.max(0, Math.floor((today - start) / 86400000));
  
  // Walk stories until we find the current one
  let bstOffset = 0;
  for (let i = 0; i < STORIES.length; i++) {
    const storyDays = STORIES[i][2].length;
    if (daysSinceStart < bstOffset + storyDays || i === STORIES.length - 1) {
      return i;
    }
    bstOffset += storyDays;
  }
  return STORIES.length - 1;
}

function getStoryReadings(si) {
  const days = STORIES[si][2];
  return days.slice(0, 5); // show up to 5 BST days
}

// ── DRAW SYMBOL ───────────────────────────────────────────────────
function drawSymbol(svgEl, type) {
  const rose = '#C9736A', lt = '#F5E8E6', gold = '#C4965A';
  const W = 80, H = 80, cx = 40, cy = 40;
  let html = '';

  if (type === 'sun') {
    html = `<circle cx="${cx}" cy="${cy}" r="16" fill="${rose}" opacity="0.9"/>
    ${[0,45,90,135,180,225,270,315].map(a => {
      const rad = a * Math.PI/180;
      const x1 = cx + Math.cos(rad)*19, y1 = cy + Math.sin(rad)*19;
      const x2 = cx + Math.cos(rad)*28, y2 = cy + Math.sin(rad)*28;
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${rose}" stroke-width="2.5" stroke-linecap="round"/>`;
    }).join('')}`;
  } else if (type === 'cross') {
    html = `<rect x="36" y="14" width="8" height="52" rx="2" fill="${rose}"/>
    <rect x="16" y="30" width="48" height="8" rx="2" fill="${rose}"/>`;
  } else if (type === 'ark') {
    html = `<ellipse cx="${cx}" cy="${cy+8}" rx="28" ry="12" fill="${gold}" opacity="0.7"/>
    <rect x="16" y="${cy-10}" width="48" height="18" rx="4" fill="${gold}"/>
    <rect x="30" y="${cy-22}" width="6" height="12" rx="2" fill="${gold}"/>
    <circle cx="52" cy="${cy-16}" r="5" fill="white" opacity="0.8"/>`;
  } else if (type === 'tower') {
    const tiers = [[28,12,48],[24,12,42],[20,12,36],[16,12,30],[12,10,24]];
    html = tiers.map(([y,h,w],i) =>
      `<rect x="${(W-w)/2}" y="${y}" width="${w}" height="${h}" rx="2" fill="${rose}" opacity="${0.5+i*0.1}"/>`
    ).join('');
  } else if (type === 'stars') {
    html = [[-16,-14],[12,-20],[20,2],[-8,16],[18,18],[-20,6]].map(([dx,dy]) =>
      `<circle cx="${cx+dx}" cy="${cy+dy}" r="${2+Math.random()}" fill="${rose}" opacity="0.8"/>`
    ).join('') + `<circle cx="${cx}" cy="${cy}" r="4" fill="${rose}"/>`;
  } else if (type === 'fire') {
    html = `<path d="M40 65 C28 55 22 44 28 32 C30 44 36 48 40 45 C40 38 36 28 42 18 C46 30 50 26 50 36 C54 28 52 20 56 16 C62 28 58 46 52 58 Z" fill="${rose}" opacity="0.85"/>
    <path d="M40 65 C34 57 30 50 34 40 C36 48 39 50 40 48 C41 44 38 38 42 30 C44 38 47 36 46 44 C50 36 48 28 50 24 C56 34 52 50 48 60 Z" fill="${lt}"/>`;
  } else if (type === 'altar') {
    html = `<rect x="18" y="46" width="44" height="10" rx="3" fill="${rose}"/>
    <rect x="26" y="36" width="28" height="10" rx="2" fill="${rose}" opacity="0.8"/>
    <path d="M40 35 C34 28 32 18 38 12 C38 22 42 24 40 28 C44 20 42 12 46 8 C50 18 46 28 40 35 Z" fill="${gold}" opacity="0.9"/>`;
  } else if (type === 'well') {
    html = `<rect x="24" y="44" width="32" height="12" rx="3" fill="${rose}" opacity="0.6"/>
    <rect x="28" y="32" width="4" height="14" rx="1" fill="${rose}"/>
    <rect x="48" y="32" width="4" height="14" rx="1" fill="${rose}"/>
    <rect x="24" y="30" width="32" height="4" rx="2" fill="${rose}"/>
    <circle cx="40" cy="44" r="8" fill="${lt}" stroke="${rose}" stroke-width="1.5"/>`;
  } else if (type === 'bowl') {
    html = `<ellipse cx="${cx}" cy="${cy+4}" rx="22" ry="10" fill="${rose}" opacity="0.7"/>
    <ellipse cx="${cx}" cy="${cy-4}" rx="22" ry="6" fill="${rose}" opacity="0.5"/>
    <ellipse cx="${cx}" cy="${cy-4}" rx="18" ry="4" fill="${lt}"/>`;
  } else if (type === 'ladder') {
    html = `<line x1="26" y1="14" x2="26" y2="66" stroke="${rose}" stroke-width="3" stroke-linecap="round"/>
    <line x1="54" y1="14" x2="54" y2="66" stroke="${rose}" stroke-width="3" stroke-linecap="round"/>
    ${[22,30,38,46,54,62].map(y => `<line x1="26" y1="${y}" x2="54" y2="${y}" stroke="${rose}" stroke-width="2.5" stroke-linecap="round"/>`).join('')}
    <circle cx="54" cy="22" r="3" fill="${gold}"/>`;
  } else if (type === 'crown') {
    html = `<path d="M18 54 L18 36 L28 46 L40 24 L52 46 L62 36 L62 54 Z" fill="${rose}" opacity="0.85"/>
    <rect x="16" y="54" width="48" height="8" rx="2" fill="${rose}"/>
    ${[28,40,52].map(x => `<circle cx="${x}" cy="28" r="3" fill="${gold}"/>`).join('')}`;
  } else if (type === 'water') {
    html = `${[0,1,2,3].map(i =>
      `<path d="M${10+i*2} ${60-i*12} Q${20+i*2} ${50-i*12} ${30+i*2} ${60-i*12} Q${40+i*2} ${70-i*12} ${50+i*2} ${60-i*12} Q${60+i*2} ${50-i*12} ${70+i*2} ${60-i*12}" fill="none" stroke="${rose}" stroke-width="2" opacity="${0.4+i*0.15}"/>`
    ).join('')}`;
  } else if (type === 'tablets') {
    html = `<rect x="14" y="20" width="22" height="40" rx="11" fill="${rose}" opacity="0.7"/>
    <rect x="44" y="20" width="22" height="40" rx="11" fill="${rose}" opacity="0.7"/>
    ${[28,33,38,43,48].map(y => `<line x1="18" y1="${y}" x2="32" y2="${y}" stroke="white" stroke-width="1.5" opacity="0.8"/>`).join('')}
    ${[28,33,38,43,48].map(y => `<line x1="48" y1="${y}" x2="62" y2="${y}" stroke="white" stroke-width="1.5" opacity="0.8"/>`).join('')}`;
  } else {
    // default cross
    html = `<rect x="36" y="14" width="8" height="52" rx="2" fill="${rose}"/>
    <rect x="16" y="30" width="48" height="8" rx="2" fill="${rose}"/>`;
  }

  svgEl.innerHTML = html;
}

// ── RENDER TODAY ──────────────────────────────────────────────────
function renderToday() {
  const si = getCurrentStoryIndex();
  const [title, desc, bstDays] = STORIES[si];
  const extras = EXTRAS[si] || {};

  // Header
  document.getElementById('today-story-num').textContent = `Story ${si+1} of ${STORIES.length}`;
  document.getElementById('today-title').textContent = title;

  const today = new Date();
  document.getElementById('today-date').textContent = today.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});

  // Progress
  const completed = Object.keys(state.completed).length;
  const pct = Math.round((completed / STORIES.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${completed} of ${STORIES.length} stories read`;

  // Symbol
  drawSymbol(document.getElementById('symbol-svg'), extras.symbol || 'cross');

  // Verse
  document.getElementById('today-verse').textContent = extras.verse || '';

  // Readings
  const list = document.getElementById('readings-list');
  list.innerHTML = '';
  const showDays = bstDays.slice(0, Math.min(bstDays.length, 6));
  showDays.forEach(day => {
    const ref = BST_READINGS[day] || `BST Day ${day}`;
    const note = SCRIPTURE_NOTES[day] || '';
    const done = state.storyProgress[si]?.includes(day);
    const li = document.createElement('li');
    li.className = 'reading-item' + (done ? ' done' : '');
    const noteHtml = note ? `<div style="font-family:Georgia,serif;font-size:13px;line-height:1.5;color:var(--ink-mid);margin-top:8px;font-style:italic;padding-left:2px;border-left:2px solid var(--rose-lt);padding-left:10px;">${note}</div>` : '';
    li.innerHTML = `<div class="reading-check"></div><div class="reading-ref"><span style="font-size:11px;color:var(--rose-mid);font-family:sans-serif">Day ${day}</span><br>${ref}${noteHtml}</div>`;
    li.onclick = (e) => { if (e.target.closest('.reading-check') || e.target === li || e.target.classList.contains('reading-ref')) toggleReading(si, day, li); };
    list.appendChild(li);
  });
  if (bstDays.length > 6) {
    const more = document.createElement('li');
    more.className = 'reading-item';
    more.innerHTML = `<div class="reading-check"></div><div class="reading-ref" style="color:var(--ink-mid);font-style:italic">+ ${bstDays.length - 6} more readings in this story</div>`;
    list.appendChild(more);
  }

  // Character
  document.getElementById('char-name').textContent = extras.character || '';
  document.getElementById('char-portrait').textContent = extras.portrait || '';

  // Map
  document.getElementById('map-loc').textContent = extras.map || '';
  document.getElementById('map-note').textContent = extras.mapNote || '';

  // Growing Story (cumulative narrative — Day 1 through today)
  const growingEl = document.getElementById('growing-story');
  let cumulative = '';
  for (let i = 0; i <= si; i++) {
    const storyTitle = STORIES[i][0];
    const storyDesc = STORIES[i][1];
    const isCurrent = (i === si);
    const titleStyle = isCurrent
      ? 'color:var(--rose);font-weight:600;'
      : 'color:var(--rose-dark);font-weight:500;';
    const descStyle = isCurrent
      ? 'color:var(--ink);'
      : 'color:var(--ink-mid);';
    cumulative += `
      <div style="margin-bottom:18px;${isCurrent ? 'padding:12px;background:var(--rose-lt);border-radius:8px;margin-left:-12px;margin-right:-12px;' : ''}">
        <div style="font-family:sans-serif;font-size:10px;letter-spacing:0.12em;color:var(--rose-mid);text-transform:uppercase;margin-bottom:4px;">Chapter ${i+1}${isCurrent ? ' • Today' : ''}</div>
        <div style="font-family:Georgia,serif;font-style:italic;font-size:16px;line-height:1.3;${titleStyle}margin-bottom:6px;">${storyTitle}</div>
        <div style="font-family:Georgia,serif;font-size:14px;line-height:1.6;${descStyle}">${storyDesc}</div>
      </div>
    `;
  }
  growingEl.innerHTML = cumulative;

  // Complete button
  const btn = document.getElementById('complete-btn');
  if (state.completed[si]) {
    btn.textContent = '✓ Story Complete';
    btn.classList.add('done');
  } else {
    btn.textContent = 'Mark Story Complete ✓';
    btn.classList.remove('done');
  }

  // Notification prompt
  renderNotifPrompt();
}

function toggleReading(si, day, el) {
  if (!state.storyProgress[si]) state.storyProgress[si] = [];
  const idx = state.storyProgress[si].indexOf(day);
  if (idx > -1) {
    state.storyProgress[si].splice(idx, 1);
    el.classList.remove('done');
  } else {
    state.storyProgress[si].push(day);
    el.classList.add('done');
  }
  saveState();
}

function markStoryComplete() {
  const si = getCurrentStoryIndex();
  if (state.completed[si]) {
    delete state.completed[si];
  } else {
    state.completed[si] = true;
    // Mark all readings done
    state.storyProgress[si] = STORIES[si][2].slice();
  }
  saveState();
  renderToday();
}

// ── RENDER SO FAR ─────────────────────────────────────────────────
function renderSoFar() {
  const si = getCurrentStoryIndex();
  const sentences = [];
  for (let i = 0; i <= si; i++) {
    const desc = STORIES[i][1];
    const first = desc.split('.')[0].trim() + '.';
    sentences.push(first);
  }
  document.getElementById('sofar-text').textContent = sentences.join(' ');
}

// ── RENDER PLAN ───────────────────────────────────────────────────
function renderPlan() {
  const si = getCurrentStoryIndex();
  const container = document.getElementById('plan-list');
  container.innerHTML = '';
  STORIES.forEach(([title,,days], i) => {
    const done = state.completed[i];
    const current = i === si;
    const div = document.createElement('div');
    div.className = 'story-row' + (done ? ' completed' : '') + (current ? ' current' : '');
    div.innerHTML = `
      <div class="story-row-num">${i+1}</div>
      <div class="story-row-content">
        <div class="story-row-title">${title}</div>
        <div class="story-row-days">${days.length} BST day${days.length!==1?'s':''}</div>
      </div>
      <div class="story-row-tick">${done ? '✓' : current ? '→' : ''}</div>
    `;
    container.appendChild(div);
  });
  // Scroll to current
  setTimeout(() => {
    const rows = container.querySelectorAll('.story-row');
    if (rows[si]) rows[si].scrollIntoView({block:'center'});
  }, 100);
}

// ── NOTIFICATIONS ─────────────────────────────────────────────────
function renderNotifPrompt() {
  const el = document.getElementById('notif-prompt');
  if (state.notifAsked || !('Notification' in window)) { el.innerHTML = ''; return; }
  if (Notification.permission === 'granted') { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="notif-banner">
    <div class="notif-icon">🔔</div>
    <div class="notif-text">Get a 6am reminder to open your daily story
      <br><button class="notif-btn" onclick="requestNotif()">Enable Daily Reminder</button>
    </div>
  </div>`;
}

function requestNotif() {
  Notification.requestPermission().then(p => {
    state.notifAsked = true;
    saveState();
    document.getElementById('notif-prompt').innerHTML = '';
    if (p === 'granted') scheduleNotif();
  });
}

function scheduleNotif() {
  if (!('serviceWorker' in navigator)) return;
  // We'll show a local notification — the SW handles the alarm
  new Notification('The Growing Story 📖', {
    body: "Your daily reading is ready. Open The Growing Story.",
    icon: '/icon-192.png'
  });
}

// ── NAVIGATION ────────────────────────────────────────────────────
let currentTab = 'today';

function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  currentTab = tab;

  if (tab === 'today') renderToday();
  else if (tab === 'sofar') renderSoFar();
  else if (tab === 'plan') renderPlan();
}

function showSoFar() { switchTab('sofar'); }
function showToday() { switchTab('today'); }

// ── INIT ──────────────────────────────────────────────────────────

// Dismiss splash after 1.8s
setTimeout(() => {
  const s = document.getElementById('splash');
  if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 600); }
}, 1800);

renderToday();

// Service Worker for offline + notifications
if ('serviceWorker' in navigator) {
  const sw = `
self.addEventListener('install', e => self.skipWaiting());
self.addEventListener('activate', e => clients.claim());
self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
`;
  const blob = new Blob([sw], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
